name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore pinned FFmpeg runtime
        shell: powershell
        run: .\Get-FFmpeg.ps1

      - name: Build and package
        shell: powershell
        run: .\Publish.ps1

      - name: Verify tag and package version
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $project = [xml](Get-Content -LiteralPath .\FRD.csproj -Raw)
          $version = $project.Project.PropertyGroup.InformationalVersion
          if ($version -ne $env:RELEASE_TAG) { throw "Tag $env:RELEASE_TAG does not match project version $version." }
          $zip = "artifacts/$version/frd-$version-win-x64.zip"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "Missing release archive: $zip" }
          $expected = ((Get-Content -LiteralPath "artifacts/$version/SHA256SUMS.txt" -Raw).Trim() -split ' ')[0]
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Release archive SHA-256 mismatch.' }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: frd-${{ github.ref_name }}-win-x64
          path: |
            artifacts/${{ github.ref_name }}/frd-${{ github.ref_name }}-win-x64.zip
            artifacts/${{ github.ref_name }}/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          .\.github\scripts\Publish-Release.ps1 -Tag $env:RELEASE_TAG `
            -NotesPath "docs/$env:RELEASE_TAG-发布说明.md" `
            -Assets "artifacts/$env:RELEASE_TAG/frd-$env:RELEASE_TAG-win-x64.zip", `
                    "artifacts/$env:RELEASE_TAG/SHA256SUMS.txt"
